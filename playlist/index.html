<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Playlist</title>

    <link rel='stylesheet' href='../styles.css'>
    <link rel='stylesheet' href='styles.css'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <section class="section-container playlist-section">
        <div class="playlist-left">
            <div class="playlist-header-row">
                <h2 class="section-title">Playlist</h2>
                <span id="playlist-count" class="playlist-count"></span>
            </div>
            <ul id="playlist"></ul>
        </div>

        <div class="playlist-right">
            <div class="player-container">
                <div class="player-info">
                    <span id="current-song">Select a song...</span>
                    <div id="current-artist"></div>
                </div>

                <div class="timeline-container">
                    <span id="current-time">0:00</span>
                    <input type="range" id="timeline" value="0" min="0" max="100">
                    <span id="duration">0:00</span>
                </div>

                <div class="player-controls">
                    <button id="prev" class="btn-small"><i class="fas fa-backward"></i></button>
                    <button id="play" class="btn-small"><i class="fas fa-play"></i></button>
                    <button id="next" class="btn-small"><i class="fas fa-forward"></i></button>
                    <div class="volume-vertical-container">
                        <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">
                    </div>
                </div>

                <div class="player-links">
                    <a id="youtube-link" href="#" target="_blank" class="btn-small secondary"><i
                            class="fab fa-youtube"></i> YouTube</a>
                    <a id="spotify-link" href="#" target="_blank" class="btn-small secondary"><i
                            class="fab fa-spotify"></i> Spotify</a>
                </div>
            </div>
        </div>

        <p class="footer">&copy; 2026 Markofwitch, <a href="../">Home</a></p>
    </section>

    <script src='index.js'></script>
</body>

</html>
